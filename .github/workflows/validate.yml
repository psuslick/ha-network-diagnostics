name: validate

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: python tools/check_privacy.py
      - run: python tools/generate_source_manifest.py
      - run: python tools/check_repo.py
      - run: pytest
      - run: python -m compileall -q custom_components tests tools
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check custom_components/network_diagnostics/frontend/network-diagnostics-panel.js

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
